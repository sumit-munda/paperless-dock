name: Paperless Dock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paperless_dock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperless_dock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paperless_dock_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/paperless_dock_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci-only-razorpay-secret
      RAZORPAY_WEBHOOK_SECRET: ci-only-webhook-secret
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_BUCKET_NAME: ci-test-bucket
      R2_ACCESS_KEY_ID: ci-only-access-key
      R2_SECRET_ACCESS_KEY: ci-only-secret-key
      R2_REGION: auto
      VITE_API_BASE_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@paperless-dock/shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Run tests
        run: npm test

      - name: Build all workspaces
        run: npm run build
